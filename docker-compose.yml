services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: debtmate
      POSTGRES_PASSWORD: debtmate
      POSTGRES_DB: debtmate
    ports:
      - "54320:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U debtmate -d debtmate"]
      interval: 5s
      timeout: 5s
      retries: 5

